[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cyelec-pipeline"
version = "0.1.0"
description = "Deterministic-first, zero-commercial-CAD-license electrical engineering pipeline for BS 7671, IEC 60364, and Electricity Authority of Cyprus (EAC) deliverables."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "cyelec-pipeline contributors" },
]
keywords = [
    "electrical-engineering",
    "bs7671",
    "iec60364",
    "cyprus",
    "eac",
    "cad",
    "dxf",
]
dependencies = [
    "ezdxf>=1.3,<2.0",
    "shapely>=2.0,<3.0",
    "networkx>=3.3,<4.0",
    "pydantic>=2.8,<3.0",
    "scipy>=1.14,<2.0",
    "openpyxl>=3.1,<4.0",
    "pdfplumber>=0.11,<1.0",
    "pyyaml>=6.0,<7.0",
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
bim = [
    "ifcopenshell>=0.8",
]
render = [
    "drawsvg>=2.3",
    "jinja2>=3.1",
    "weasyprint>=62.0",
]
gcp = [
    "google-cloud-firestore>=2.19",
    "google-cloud-storage>=2.18",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "types-PyYAML>=6.0",
    "types-openpyxl>=3.1",
    "bandit>=1.7",
    "pip-audit>=2.7",
]
ui = [
    "playwright>=1.49",
]

[project.scripts]
cyelec = "cyelec.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cyelec"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
packages = ["cyelec"]

[[tool.mypy.overrides]]
module = [
    "ezdxf.*",
    "shapely.*",
    "networkx.*",
    "scipy.*",
    "ifcopenshell.*",
    "google.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/regression"]
addopts = "-ra"
markers = [
    "ui: Playwright live browser UI regression tests (run via tests/e2e/test_ui_playwright.py)",
    "golden: Strict 0%-tolerance exact-match engineering regression snapshots",
    "perf: Tier-1 per-stage latency, memory, and 48-room large-CAD stress budgets",
    "e2e: End-to-end live or container operational tests",
]
