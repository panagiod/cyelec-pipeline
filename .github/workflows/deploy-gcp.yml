name: Deploy to Google Cloud Run (EU)

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Cloud Run environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: europe-west1
  AR_REPO: cyelec
  IMAGE_NAME: cyelec-api

jobs:
  deploy:
    # Skip automatic push deploys cleanly until GCP_PROJECT_ID repo variable is configured
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve target environment
        id: target
        run: |
          ENV_NAME="${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}"
          echo "env=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "tf_state_bucket=${{ vars.GCP_PROJECT_ID }}-cyelec-tfstate" >> "$GITHUB_OUTPUT"
          echo "image_uri=${GCP_REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${AR_REPO}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud via Keyless OIDC (WIF)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Configure Docker for EU Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push immutable SHA-pinned container image
        run: |
          docker build -t "${{ steps.target.outputs.image_uri }}" .
          docker push "${{ steps.target.outputs.image_uri }}"

      - name: Prune older Artifact Registry images (keep newest 2 for €0.00/mo free tier)
        run: |
          REPO_PATH="${GCP_REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${AR_REPO}/${IMAGE_NAME}"
          OLD_DIGESTS="$(gcloud artifacts docker images list "${REPO_PATH}" \
            --include-tags \
            --sort-by="~UPDATE_TIME" \
            --format="value(version)" | tail -n +3 || true)"
          for digest in ${OLD_DIGESTS}; do
            echo "Pruning old image digest: ${digest}"
            gcloud artifacts docker images delete "${REPO_PATH}@${digest}" \
              --delete-tags --quiet || true
          done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform Init & Apply (Cloud Run + Firestore + GCS in europe-west1)
        working-directory: deploy/gcp/terraform
        env:
          TF_VAR_pilot_invite_code: ${{ secrets.CYELEC_PILOT_INVITE_CODE || vars.CYELEC_PILOT_INVITE_CODE || '' }}
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.target.outputs.tf_state_bucket }}" \
            -backend-config="prefix=cyelec/${{ steps.target.outputs.env }}"
          terraform apply -auto-approve \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${GCP_REGION}" \
            -var="environment=${{ steps.target.outputs.env }}" \
            -var="image_uri=${{ steps.target.outputs.image_uri }}" \
            -var="prod_min_instances=${{ vars.CYELEC_PROD_MIN_INSTANCES || '0' }}" \
            -var="budget_gate_mode=${{ vars.CYELEC_BUDGET_GATE_MODE || 'pause_ingress' }}" \
            -var="alert_email=${{ vars.CYELEC_ALERT_EMAIL || '' }}" \
            -var="custom_domain=${{ vars.CYELEC_CUSTOM_DOMAIN || '' }}" \
            -var="google_client_id=${{ vars.CYELEC_GOOGLE_CLIENT_ID || '' }}" \
            -var="stripe_secret_id=${{ vars.CYELEC_STRIPE_SECRET_ID || '' }}" \
            -var="stripe_webhook_secret_id=${{ vars.CYELEC_STRIPE_WEBHOOK_SECRET_ID || '' }}" \
            -var="stripe_price_pilot=${{ vars.CYELEC_STRIPE_PRICE_PILOT || '' }}" \
            -var="stripe_price_pro=${{ vars.CYELEC_STRIPE_PRICE_PRO || '' }}" \
            -var="stripe_price_enterprise=${{ vars.CYELEC_STRIPE_PRICE_ENTERPRISE || '' }}" \
            -var="jwt_secret_id=${{ vars.CYELEC_JWT_SECRET_ID || '' }}"
          SERVICE_URL="$(terraform output -raw service_url)"
          echo "service_url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"
        id: tf

      - name: Live Post-Deploy Health, Security Headers & Backend Verification
        run: |
          URL="${{ steps.tf.outputs.service_url }}"
          ENV_NAME="${{ steps.target.outputs.env }}"
          echo "Verifying live Cloud Run endpoint: ${URL}/health"
          HDR_FILE="$(mktemp)"
          RESP="$(curl -fsS --retry 5 --retry-delay 3 -D "${HDR_FILE}" "${URL}/health")"
          echo "${RESP}"
          python3 -c '
          import json, sys
          data = json.loads(sys.argv[1])
          hdrs = open(sys.argv[2], encoding="utf-8").read().lower()
          assert data["status"] == "ok", f"Unhealthy: {data}"
          assert data["store_backend"] == "firestore", f"Wrong store backend: {data}"
          assert data.get("ifc_available") is True, f"IFC BIM not enabled: {data}"
          assert data.get("dwg_available") is True, f"DWG converter not enabled: {data}"
          assert data.get("pdf_export_available") is True, f"WeasyPrint PDF not enabled: {data}"
          for required in (
              "x-frame-options: deny",
              "x-content-type-options: nosniff",
              "referrer-policy: no-referrer",
              "content-security-policy:",
              "strict-transport-security:",
          ):
              assert required in hdrs, f"Missing security header: {required}"
          print("VERIFIED: status=ok, store_backend=firestore, ifc=true, dwg=true, pdf=true, OWASP headers present, version=" + data["pipeline_version"])
          ' "${RESP}" "${HDR_FILE}"
          if [ "${ENV_NAME}" = "prod" ]; then
            OPENAPI_CODE="$(curl -s -o /dev/null -w '%{http_code}' "${URL}/openapi.json")"
            test "${OPENAPI_CODE}" = "404" || (echo "Expected prod /openapi.json 404, got ${OPENAPI_CODE}" && exit 1)
            for page in "/" "/guide"; do
              PAGE_HTML="$(curl -fsS "${URL}${page}")"
              if echo "${PAGE_HTML}" | grep -q 'href="/docs"'; then
                echo "Prod ${page} must not expose broken /docs link!"
                exit 1
              fi
            done
            echo "VERIFIED: prod /openapi.json disabled (HTTP 404) & /docs hidden on / and /guide"
          fi
