name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality-unit-golden:
    name: Quality, Coverage (>=85%) & Golden Exact-Match
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"

      - name: Lint with ruff
        run: ruff check src tests scripts

      - name: Type-check with mypy
        run: mypy src

      - name: Static security analysis (Bandit SAST)
        run: bandit -r src/cyelec -ll

      - name: Dependency CVE audit (pip-audit)
        run: pip-audit --skip-editable --desc=off

      - name: Run parallel Unit, Integration & Exact-Match Golden Suite (>=85% coverage)
        run: pytest -n auto --cov=cyelec --cov-report=term-missing --cov-fail-under=85

      - name: CLI smoke test
        run: |
          cyelec version
          cyelec check-standards
          cyelec solve-synth --out-dir /tmp/cyelec_ci_out
          cyelec inspect-dxf /tmp/cyelec_ci_out/cyprus_3bed_120m2.dxf
          cyelec solve-dxf /tmp/cyelec_ci_out/cyprus_3bed_120m2.dxf --out-dir /tmp/cyelec_ci_p2
          cyelec solve-eac /tmp/cyelec_ci_out/cyprus_3bed_120m2.dxf --out-dir /tmp/cyelec_ci_p3
          cyelec export-sld /tmp/cyelec_ci_p3/design_result.json --out-dir /tmp/cyelec_ci_sld
          cyelec benchmark-suite --out-dir /tmp/cyelec_ci_bench

  playwright-ui:
    name: Playwright Browser UI Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package, Playwright & Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev,ui]"
          python -m playwright install --with-deps chromium

      - name: Run Playwright UI regression suite (1440 / 768 / 390px + 5 sheets + 0 errors)
        env:
          CYELEC_SCREENSHOT_DIR: ui_screenshots
        run: pytest tests/e2e/test_ui_playwright.py -v

      - name: Upload Playwright UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-ui-screenshots
          path: ui_screenshots
          if-no-files-found: ignore
          retention-days: 7

  perf-tier1-stress:
    name: Tier-1 Performance Budgets & 48-Room Stress
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"

      - name: Run Tier-1 performance budgets & 48-room 4-storey large-CAD stress test
        env:
          CYELEC_PERF_REPORT: perf_tier1_report.json
        run: |
          pytest tests/perf/test_perf_budgets.py -v
          cat perf_tier1_report.json

      - name: Upload Tier-1 performance telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-tier1-report
          path: perf_tier1_report.json
          if-no-files-found: ignore
          retention-days: 14

  docker-container-e2e:
    name: Docker Container E2E (.dwg/.ifc/PDF) & Tier-2 Perf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build production Dockerfile (GHA layer cache)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: cyelec-ci:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python 3.12 for E2E & Perf client harnesses
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install client dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"

      - name: Run Docker Container Integration Smoke (MIT .dwg + .ifc + 12 WeasyPrint PDFs)
        run: |
          CID="$(docker run -d --rm -p 127.0.0.1:18080:8080 \
            -e CYELEC_ENV=staging \
            -e CYELEC_AUTH_REQUIRED=false \
            -e CYELEC_ALLOW_ANONYMOUS=true \
            cyelec-ci:test)"
          trap 'docker rm -f "${CID}" >/dev/null 2>&1 || true' EXIT
          python3 scripts/e2e_docker_smoke.py \
            --url http://127.0.0.1:18080 \
            --report docker_e2e_report.json

      - name: Run Tier-2 Concurrency (4x ZIP) & 30-Solve Soak on 2 vCPU / 2 GiB (main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 scripts/perf_docker_suite.py \
            --image cyelec-ci:test \
            --report perf_tier2_report.json

      - name: Upload Docker E2E & Tier-2 performance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-e2e-and-tier2-perf
          path: |
            docker_e2e_report.json
            perf_tier2_report.json
          if-no-files-found: ignore
          retention-days: 14
