name: Daily Live Monitor & Weekly Perf Soak

on:
  schedule:
    # Daily 06:00 UTC zero-write live EU Staging & Production health/security/latency probe (€0.00 cost)
    - cron: "0 6 * * *"
    # Weekly Sunday 04:00 UTC Tier-2 Docker 2 vCPU / 2 GiB concurrency & 30-solve memory-leak soak
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      run_tier2_soak:
        description: "Also run Tier-2 Docker 2 vCPU / 2 GiB 4x parallel ZIP & 30-solve soak"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  STAGING_URL: ${{ vars.CYELEC_STAGING_URL || 'https://cyelec-staging-hym54lfrsq-ew.a.run.app' }}
  PROD_URL: ${{ vars.CYELEC_PROD_URL || 'https://cyelec-prod-hym54lfrsq-ew.a.run.app' }}

jobs:
  live-zero-write-monitor:
    name: Daily Zero-Write Live EU Staging & Prod Monitor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lightweight HTTP client deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"

      - name: Zero-write monitor EU Production (/health, OWASP headers, /openapi.json 404, 401 auth gate)
        run: |
          python3 scripts/e2e_live_ops.py \
            --env monitor \
            --is-prod \
            --url "${PROD_URL}" \
            --report monitor_prod.json

      - name: Zero-write monitor EU Staging (/health, OWASP headers, live solve)
        run: |
          python3 scripts/e2e_live_ops.py \
            --env monitor \
            --url "${STAGING_URL}" \
            --report monitor_staging.json

      - name: Upload monitor reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-live-monitor-reports
          path: |
            monitor_prod.json
            monitor_staging.json
          if-no-files-found: ignore
          retention-days: 14

  weekly-tier2-perf-soak:
    name: Weekly Tier-2 Docker (2 vCPU / 2 GiB) Concurrency & Soak
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_tier2_soak == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build production Dockerfile (GHA layer cache)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: cyelec-ci:soak
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install client dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"

      - name: Run Tier-2 Docker 2 vCPU / 2 GiB 4x Parallel ZIP & 30-Solve Leak Soak
        run: |
          python3 scripts/perf_docker_suite.py \
            --image cyelec-ci:soak \
            --report weekly_perf_tier2.json

      - name: Upload Weekly Tier-2 Performance Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weekly-tier2-perf-report
          path: weekly_perf_tier2.json
          if-no-files-found: ignore
          retention-days: 30
